# ──────────────── 基础设置 ────────────────
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: :9090
udp-timeout: 60

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  respect-host-rules: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - 'ipcheck.ing'
    - 'browserleaks.com'
    - 'ipinfo.io'
    - 'scamalytics.com'
    - '*.lan'
    - localhost.ptlogin2.qq.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - 'stun.*.*'
    - '*.stun.*'
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    # 确保订阅域名直连
    '': [223.5.5.5, 119.29.29.29]   # <--- 【必改】填写节点订阅节点域名
    '': [223.5.5.5, 119.29.29.29]   # <--- 【必改】填写节点订阅节点域名
    'geosite:cn':
      - 119.29.29.29
      - 223.5.5.5
      - 114.114.114.114
    'geosite:!cn':
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query

  fallback:
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.x.com"
      - "+.openai.com"
      - "+.tiktok.com"
      - "+.icloud.com"
      - "+.apple.com"
      - "+.cloudflare.com"
      - "+.amazonaws.com"
      - "+.doubleclick.net"
      - "+.ghproxy.com"
  default-nameserver-policy: false

# ──────────────── 节点配置 ──────────────── 
# === 机场订阅分区（支持多机场同时使用）===
.anchors:
  all_providers: &all_providers [机场01,机场02]  # <--- 【选改】 如果添加多个机场订阅，需要填写机场名称（如：机场01, 机场02）
  test_params: &test_params
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

proxy-providers:
  机场01:
    type: http
    url: ""    # <--- 【必改】 填写机场订阅地址
    path: ./proxies/provider_sub_01.yaml  # <--- 【选改】 对应机场的文件(多订阅才修改)
    interval: 3600
    headers:
      User-Agent: "Clash/OpenClash"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
    proxy: DIRECT

  机场02:
    type: http
    url: ""    # <--- 【必改】 填写机场订阅地址
    path: ./proxies/provider_sub_02.yaml  # <--- 【选改】 对应机场的文件(多订阅才修改)
    interval: 3600
    headers:
      User-Agent: "Clash/OpenClash"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
    proxy: DIRECT
 
# === 自建节点分区（支持不同协议）===
proxies:
  # === 自建节点添加（【必改】替换为真实信息）===
  # - {name: 自建节点A, server: 1.2.3.4, port: 443, type: trojan, password: pass123, sni: example.com, skip-cert-verify: false, network: ws, ws-opts: {path: /demo_path, headers: {Host: example.com}}}
  # - {name: 自建节点B, server: 2.3.4.5, port: 443, type: trojan, password: pass456, sni: example.org, skip-cert-verify: false, network: ws, ws-opts: {path: /demo_path2, headers: {Host: example.org}}}

