proxy-groups:
# ======= 住宅IP-机场节点选择 =======
# - name: 住宅A-中继组
#   type: select
#   proxies:
#     - 自动选择
#     - 香港-自动
#     - 台湾-自动
#     - 日本-自动
#     - 新加坡-自动
#     - 韩国-自动
#     - 美国-自动
#     - 英国-自动
#     - 其他-自动
#     - 自建节点A
#     - 自建节点B

# - name: 住宅B-中继组  # 【默认禁用】启用请去掉#（住宅B启用才能开启）
#   type: select
#   proxies:    
#      - 自动选择
#      - 香港-自动
#      - 台湾-自动
#      - 日本-自动
#      - 新加坡-自动
#      - 韩国-自动
#      - 美国-自动
#      - 英国-自动
#      - 其他-自动
#      - 自建节点A
#      - 自建节点B

  # ======= 未设规则默认节点选择 =======
  - name: 节点选择
    type: select
    proxies:
#     - 自建节点A
#     - 自建节点B    
      - 自动选择
      - 香港-自动
      - 台湾-自动
      - 日本-自动
      - 新加坡-自动
      - 韩国-自动
      - 美国-自动
      - 英国-自动
      - 其他-自动
      - DIRECT

  - name: 自动选择
    type: url-test
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(直连|拒绝|套餐|流量|官网|重置|更新|到期|公告|导航)).*$"

  - name: 香港-自动
    type: url-test
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广港|香港|HK|Hong Kong|🇭🇰|HongKong).*$"

  - name: 台湾-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan).*$" 

  - name: 日本-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan).*$"

  - name: 新加坡-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore).*$"

  - name: 韩国-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea).*$"

  - name: 美国-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States).*$"

  - name: 英国-自动
    type: url-test 
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(套餐|流量|官网|重置|更新|到期|公告|导航)).*(英国|英|伦敦|UK|United Kingdom|🇬🇧|London).*$"

  - name: 其他-自动
    type: url-test
    use: *all_providers
    <<: *test_params
    filter: "(?i)^(?!.*(直连|拒绝|套餐|流量|官网|重置|更新|到期|公告|链式代理|住宅|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK|United Kingdom|伦敦|英|London|🇬🇧)).*$"

# ──────────────── 分流规则(可选) ────────────────
rules:
  - DOMAIN-SUFFIX,stun.l.google.com,REJECT
  - DOMAIN-KEYWORD,stun,REJECT
  - DOMAIN-KEYWORD,turn,REJECT
  - DOMAIN-KEYWORD,rtc,REJECT

  # =======  一机一住宅（配合 DHCP 静态分配固定IP 使用） =======
  #- SRC-IP-CIDR,192.168.50.138/32,链式代理-住宅A
  #- SRC-IP-CIDR,192.168.20.208/32,链式代理-住宅A

  # =======  一网段一住宅（配合多Wi-Fi不同网段 使用） =======
  # - SRC-IP-CIDR,192.168.110.0/24,链式代理-住宅A
  # - SRC-IP-CIDR,192.168.120.0/24,链式代理-住宅B

  - GEOIP,CN,DIRECT
  - MATCH,节点选择